# Flow.io — Dashboard YAML, sans JavaScript spécifique ni template JavaScript.
# Cartes HACS utilisées : Mushroom 5+, card-mod, mini-graph-card,
# Modern Circular Gauge récent (templates Jinja dans min/max/segments).
# Coller le fichier complet dans la configuration brute du dashboard.
# Les huit vues sont les huit onglets natifs de Home Assistant.
# Les ancrages YAML mutualisent les styles ; aucun fichier JS Flow.io à charger.
# Les plages de jauges sont relatives aux consignes : repères visuels uniquement.
# Si une consigne manque, la jauge est grise et ne présume aucune plage normale.
# Pour le fond clair et la typographie globale : thème YAML facultatif dans
# home-assistant/flowio-theme.yaml ; installation dans home-assistant/README.md.

title: Piscine · Flow.io
views:
  - title: Piscine
    path: piscine
    icon: mdi:pool
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-legacy-template-card
            entity: binary_sensor.fio_alm_any_active
            primary: |-
              {% if not has_value(entity) %}Piscine indisponible{% elif is_state(entity, 'on') %}Intervention requise{% elif is_state('switch.fio_pl_modes_winter', 'on') %}Mode hivernage{% else %}Piscine · aucune alarme{% endif %}
            secondary: |-
              {% if has_value('switch.fio_pl_modes_auto') %}{{ 'Automatique' if is_state('switch.fio_pl_modes_auto', 'on') else 'Manuel' }}{% else %}Mode indisponible{% endif %} · {% if is_number(states('sensor.fio_pl_flt_start')) and is_number(states('sensor.fio_pl_flt_stop')) %}filtration {{ states('sensor.fio_pl_flt_start') }}h–{{ states('sensor.fio_pl_flt_stop') }}h{% else %}horaires indisponibles{% endif %} · {{ states('select.fio_pl_modes_dis') }}
            icon: mdi:pool
            icon_color: |-
              {% if not has_value(entity) %}grey{% elif is_state(entity, 'on') %}red{% else %}blue{% endif %}
            multiline_secondary: true
            tap_action:
              action: navigate
              navigation_path: alarmes
            card_mod:
              style: |
                ha-card {
                  background: #FFFFFF;
                  color: #1C1C1E;
                  border: 1px solid #E3E3E8;
                  border-radius: 22px;
                  box-shadow: none;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                  --primary-text-color: #1C1C1E;
                  --secondary-text-color: #8A8F99;
                  --paper-item-icon-color: #8A8F99;
                  --primary-color: #168AFF;
                  --state-switch-active-color: #168AFF;
                }
                ha-card { padding: 8px; --card-primary-font-size: 20px; --card-primary-font-weight: 650; --card-secondary-font-size: 13px; }
            grid_options:
              columns: 12
              rows: auto
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                entity: sensor.fio_wifi_ip
                tap_action: &more_info
                  action: more-info
                icon: mdi:circle-small
                icon_color: '{{ ''green'' if has_value(''sensor.fio_wifi_ip'') else ''red'' }}'
                content: '{{ ''En ligne'' if has_value(''sensor.fio_wifi_ip'') else ''Indisponible'' }}'
              - type: template
                entity: sensor.fio_wifi_rssi
                tap_action: *more_info
                icon: mdi:wifi
                icon_color: blue
                content: |-
                  {% if has_value('sensor.fio_wifi_rssi') %}{{ states('sensor.fio_wifi_rssi') }} {{ state_attr('sensor.fio_wifi_rssi', 'unit_of_measurement') or '' }}{% else %}Indisponible{% endif %}
              - type: template
                entity: sensor.fio_sys_upt_mn
                tap_action: *more_info
                icon: mdi:clock-outline
                icon_color: grey
                content: |-
                  {% if has_value('sensor.fio_sys_upt_mn') and is_number(states('sensor.fio_sys_upt_mn')) %}{% set m = states('sensor.fio_sys_upt_mn') | float  %}{{ (m / 1440) | round(1) ~ ' j' if m >= 1440 else (m / 60) | round(1) ~ ' h' if m >= 60 else m | round(0) | int ~ ' min' }}{% else %}Indisponible{% endif %}
              - type: template
                entity: binary_sensor.fio_alm_any_active
                tap_action:
                  action: navigate
                  navigation_path: alarmes
                icon: mdi:shield-check-outline
                icon_color: |-
                  {% if not has_value('binary_sensor.fio_alm_any_active') %}grey{% elif is_state('binary_sensor.fio_alm_any_active','on') %}red{% else %}green{% endif %}
                content: |-
                  {% if has_value('binary_sensor.fio_alm_any_active') %}{% if is_state('binary_sensor.fio_alm_any_active', 'off') %}Aucune alarme{% else %}{{ states('sensor.fio_alm_active_count') }} alarme(s){% endif %}{% else %}Indisponible{% endif %}
            card_mod:
              style: 'ha-card { --chip-background: #F2F2F5; --chip-border-width: 0; --chip-box-shadow: none; --chip-border-radius:
                18px; --chip-font-weight: 500; }'
            grid_options:
              columns: 12
              rows: auto
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:modern-circular-gauge
                entity: sensor.fio_io_ph
                name: pH
                unit: ''
                decimals: 1
                gauge_type: standard
                min: '{{ (states(''number.fio_pl_ph_setpoint'') | float + -1.5) if is_number(states(''number.fio_pl_ph_setpoint''))
                  else 0 }}'
                max: '{{ (states(''number.fio_pl_ph_setpoint'') | float + 1.5) if is_number(states(''number.fio_pl_ph_setpoint''))
                  else 3.0 }}'
                needle: true
                show_icon: false
                show_header: false
                state_font_size: 32
                gauge_background_style:
                  width: 6
                  opacity: 0.45
                gauge_foreground_style:
                  width: 6
                segments:
                  - from: '{{ (states(''number.fio_pl_ph_setpoint'') | float + -1.5) if is_number(states(''number.fio_pl_ph_setpoint''))
                      else 0.0 }}'
                    color: '{{ ''#FF453A'' if is_number(states(''number.fio_pl_ph_setpoint'')) else ''#C7C7CC'' }}'
                  - from: '{{ (states(''number.fio_pl_ph_setpoint'') | float + -0.3) if is_number(states(''number.fio_pl_ph_setpoint''))
                      else 1.2 }}'
                    color: '{{ ''#FFB340'' if is_number(states(''number.fio_pl_ph_setpoint'')) else ''#C7C7CC'' }}'
                  - from: '{{ (states(''number.fio_pl_ph_setpoint'') | float + -0.1) if is_number(states(''number.fio_pl_ph_setpoint''))
                      else 1.4 }}'
                    color: '{{ ''#30C85A'' if is_number(states(''number.fio_pl_ph_setpoint'')) else ''#C7C7CC'' }}'
                  - from: '{{ (states(''number.fio_pl_ph_setpoint'') | float + 0.1) if is_number(states(''number.fio_pl_ph_setpoint''))
                      else 1.6 }}'
                    color: '{{ ''#FFB340'' if is_number(states(''number.fio_pl_ph_setpoint'')) else ''#C7C7CC'' }}'
                  - from: '{{ (states(''number.fio_pl_ph_setpoint'') | float + 0.3) if is_number(states(''number.fio_pl_ph_setpoint''))
                      else 1.8 }}'
                    color: '{{ ''#FF453A'' if is_number(states(''number.fio_pl_ph_setpoint'')) else ''#C7C7CC'' }}'
                tap_action: *more_info
                card_mod: &white_card
                  style: |
                    ha-card {
                      background: #FFFFFF;
                      color: #1C1C1E;
                      border: 1px solid #E3E3E8;
                      border-radius: 22px;
                      box-shadow: none;
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                      --primary-text-color: #1C1C1E;
                      --secondary-text-color: #8A8F99;
                      --paper-item-icon-color: #8A8F99;
                      --primary-color: #168AFF;
                      --state-switch-active-color: #168AFF;
                    }
              - type: custom:modern-circular-gauge
                entity: sensor.fio_io_orp
                name: ORP
                unit: mV
                decimals: 0
                gauge_type: standard
                min: '{{ (states(''number.fio_pl_dis_setpoint'') | float + -300) if is_number(states(''number.fio_pl_dis_setpoint''))
                  else 0 }}'
                max: '{{ (states(''number.fio_pl_dis_setpoint'') | float + 300) if is_number(states(''number.fio_pl_dis_setpoint''))
                  else 600 }}'
                needle: true
                show_icon: false
                show_header: false
                state_font_size: 32
                gauge_background_style:
                  width: 6
                  opacity: 0.45
                gauge_foreground_style:
                  width: 6
                segments:
                  - from: '{{ (states(''number.fio_pl_dis_setpoint'') | float + -300) if is_number(states(''number.fio_pl_dis_setpoint''))
                      else 0 }}'
                    color: '{{ ''#FF453A'' if is_number(states(''number.fio_pl_dis_setpoint'')) else ''#C7C7CC'' }}'
                  - from: '{{ (states(''number.fio_pl_dis_setpoint'') | float + -160) if is_number(states(''number.fio_pl_dis_setpoint''))
                      else 140 }}'
                    color: '{{ ''#FFB340'' if is_number(states(''number.fio_pl_dis_setpoint'')) else ''#C7C7CC'' }}'
                  - from: '{{ (states(''number.fio_pl_dis_setpoint'') | float + -100) if is_number(states(''number.fio_pl_dis_setpoint''))
                      else 200 }}'
                    color: '{{ ''#30C85A'' if is_number(states(''number.fio_pl_dis_setpoint'')) else ''#C7C7CC'' }}'
                  - from: '{{ (states(''number.fio_pl_dis_setpoint'') | float + 100) if is_number(states(''number.fio_pl_dis_setpoint''))
                      else 400 }}'
                    color: '{{ ''#FFB340'' if is_number(states(''number.fio_pl_dis_setpoint'')) else ''#C7C7CC'' }}'
                  - from: '{{ (states(''number.fio_pl_dis_setpoint'') | float + 160) if is_number(states(''number.fio_pl_dis_setpoint''))
                      else 460 }}'
                    color: '{{ ''#FF453A'' if is_number(states(''number.fio_pl_dis_setpoint'')) else ''#C7C7CC'' }}'
                tap_action: *more_info
                card_mod: *white_card
            grid_options:
              columns: 12
              rows: auto
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:mushroom-entity-card
                entity: switch.fio_io_flt_pmp
                name: Filtr.
                icon: mdi:pool
                layout: vertical
                tap_action:
                  action: toggle
                hold_action: *more_info
                card_mod: &quick_control
                  style: |
                    ha-card {
                      background: #FFFFFF;
                      color: #1C1C1E;
                      border: 1px solid #E3E3E8;
                      border-radius: 22px;
                      box-shadow: none;
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                      --primary-text-color: #1C1C1E;
                      --secondary-text-color: #8A8F99;
                      --paper-item-icon-color: #8A8F99;
                      --primary-color: #168AFF;
                      --state-switch-active-color: #168AFF;
                    }
                    ha-card { background: transparent; border: none; --card-primary-font-size: 13px; --card-secondary-font-size: 12px; }
              - type: custom:mushroom-entity-card
                entity: switch.fio_io_robot
                name: Robot
                icon: mdi:robot-vacuum
                layout: vertical
                tap_action:
                  action: toggle
                hold_action: *more_info
                card_mod: *quick_control
              - type: custom:mushroom-entity-card
                entity: switch.fio_io_lights
                name: Éclair.
                icon: mdi:lightbulb-outline
                layout: vertical
                tap_action:
                  action: toggle
                hold_action: *more_info
                card_mod: *quick_control
              - type: custom:mushroom-entity-card
                entity: switch.fio_io_wat_htr
                name: Chauff.
                icon: mdi:radiator
                layout: vertical
                tap_action:
                  action: toggle
                hold_action: *more_info
                card_mod: *quick_control
            grid_options:
              columns: 12
              rows: auto
          - type: entities
            show_header_toggle: false
            state_color: true
            entities:
              - entity: switch.fio_pl_modes_auto
                name: Filtration automatique
                icon: mdi:autorenew
              - entity: switch.fio_pl_modes_winter
                name: Hivernage
                icon: mdi:snowflake
            card_mod: &settings_list
              style: |
                ha-card {
                  background: #FFFFFF;
                  color: #1C1C1E;
                  border: 1px solid #E3E3E8;
                  border-radius: 22px;
                  box-shadow: none;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                  --primary-text-color: #1C1C1E;
                  --secondary-text-color: #8A8F99;
                  --paper-item-icon-color: #8A8F99;
                  --primary-color: #168AFF;
                  --state-switch-active-color: #168AFF;
                }
                #states { padding: 8px 16px; }
                #states > div { margin: 0; padding: 12px 0; }
                #states > div + div { border-top: 1px solid #F0F0F3; }
                .card-header { font-size: 18px; font-weight: 650; padding-bottom: 4px; }
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: custom:mini-graph-card
            name: Températures
            hours_to_show: 24
            points_per_hour: 2
            line_width: 2
            height: 140
            font_size: 90
            show:
              labels: true
              legend: false
              fill: fade
              extrema: false
            entities:
              - entity: sensor.fio_io_wat_tmp
                name: Eau
                color: '#FF9500'
                show_state: true
              - entity: sensor.fio_io_air_tmp
                name: Air
                color: '#168AFF'
                show_state: true
            card_mod: *white_card
            grid_options:
              columns: 12
              rows: auto
          - type: custom:mini-graph-card
            name: Chimie
            hours_to_show: 24
            points_per_hour: 2
            line_width: 2
            height: 140
            font_size: 90
            show:
              labels: true
              legend: false
              fill: fade
              extrema: false
            entities:
              - entity: sensor.fio_io_ph
                name: pH
                color: '#E7BD30'
                show_state: true
              - entity: sensor.fio_io_orp
                name: ORP
                color: '#168AFF'
                show_state: true
                y_axis: secondary
            card_mod: *white_card
            grid_options:
              columns: 12
              rows: auto
  - title: Filtration
    path: filtration
    icon: mdi:pump
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Modes
            heading_style: title
          - type: entities
            show_header_toggle: false
            state_color: true
            entities:
              - entity: switch.fio_pl_modes_auto
                name: Régulation automatique
                icon: mdi:autorenew
              - entity: switch.fio_pl_modes_winter
                name: Mode hivernage
                icon: mdi:snowflake
            card_mod: *settings_list
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Fenêtre calculée
            heading_style: title
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-legacy-template-card
                entity: sensor.fio_pl_flt_start
                primary: Démarrage calculé
                secondary: |-
                  {% if has_value('sensor.fio_pl_flt_start') and is_number(states('sensor.fio_pl_flt_start')) %}{{ '%02d:%02d' | format((states('sensor.fio_pl_flt_start') | float * 60) | round | int // 60, (states('sensor.fio_pl_flt_start') | float * 60) | round | int % 60) }}{% else %}Indisponible{% endif %}
                multiline_secondary: true
                icon: mdi:clock-outline
                icon_color: green
                tap_action: *more_info
                card_mod: &measure_tile
                  style: |
                    ha-card {
                      background: #FFFFFF;
                      color: #1C1C1E;
                      border: 1px solid #E3E3E8;
                      border-radius: 22px;
                      box-shadow: none;
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                      --primary-text-color: #1C1C1E;
                      --secondary-text-color: #8A8F99;
                      --paper-item-icon-color: #8A8F99;
                      --primary-color: #168AFF;
                      --state-switch-active-color: #168AFF;
                    }
                    ha-card {
                      background: #F2F2F5;
                      border: none;
                      border-radius: 16px;
                      padding: 8px 2px;
                      --card-primary-font-size: 13px;
                      --card-primary-color: #8A8F99;
                      --card-primary-font-weight: 500;
                      --card-secondary-font-size: 22px;
                      --card-secondary-font-weight: 650;
                      --card-secondary-color: #1C1C1E;
                      --card-secondary-line-height: 1.4;
                    }
              - type: custom:mushroom-legacy-template-card
                entity: sensor.fio_pl_flt_stop
                primary: Arrêt calculé
                secondary: |-
                  {% if has_value('sensor.fio_pl_flt_stop') and is_number(states('sensor.fio_pl_flt_stop')) %}{{ '%02d:%02d' | format((states('sensor.fio_pl_flt_stop') | float * 60) | round | int // 60, (states('sensor.fio_pl_flt_stop') | float * 60) | round | int % 60) }}{% else %}Indisponible{% endif %}
                multiline_secondary: true
                icon: mdi:clock-outline
                icon_color: green
                tap_action: *more_info
                card_mod: *measure_tile
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Règles de calcul
            heading_style: title
          - type: entities
            show_header_toggle: false
            state_color: true
            entities:
              - entity: number.fio_pl_wat_temp_sp
                name: Température de consigne
                icon: mdi:thermometer
                type: simple-entity
                tap_action: *more_info
              - entity: number.fio_pl_flt_start_min
                name: Démarrage au plus tôt
                icon: mdi:clock-outline
                type: simple-entity
                tap_action: *more_info
              - entity: number.fio_pl_flt_stop_max
                name: Arrêt au plus tard
                icon: mdi:clock-outline
                type: simple-entity
                tap_action: *more_info
              - entity: button.fio_pl_flt_recalc
                name: Recalculer la fenêtre
                icon: mdi:autorenew
            card_mod: *settings_list
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Pompe de filtration
            heading_style: title
          - type: grid
            columns: 2
            square: false
            cards:
              - type: entities
                show_header_toggle: false
                state_color: true
                entities:
                  - entity: switch.fio_io_flt_pmp
                    name: Filtration
                    icon: mdi:pool
                card_mod: *settings_list
              - type: custom:mushroom-legacy-template-card
                entity: sensor.fio_pd_flt_upt_mn
                primary: Fonctionnement aujourd’hui
                secondary: |-
                  {% if has_value('sensor.fio_pd_flt_upt_mn') and is_number(states('sensor.fio_pd_flt_upt_mn')) %}{% set m = states('sensor.fio_pd_flt_upt_mn') | float  %}{{ (m / 1440) | round(1) ~ ' j' if m >= 1440 else (m / 60) | round(1) ~ ' h' if m >= 60 else m | round(0) | int ~ ' min' }}{% else %}Indisponible{% endif %}
                multiline_secondary: true
                icon: mdi:timer-outline
                icon_color: blue
                tap_action: *more_info
                card_mod: *measure_tile
              - type: custom:mushroom-legacy-template-card
                entity: number.fio_pd0_flow
                primary: Débit
                secondary: |-
                  {% if has_value('number.fio_pd0_flow') %}{{ states('number.fio_pd0_flow') }} {{ state_attr('number.fio_pd0_flow', 'unit_of_measurement') or '' }}{% else %}Indisponible{% endif %}
                multiline_secondary: true
                icon: mdi:water-outline
                icon_color: grey
                tap_action: *more_info
                card_mod: *measure_tile
              - type: custom:mushroom-legacy-template-card
                entity: number.fio_pd0_max_upt
                primary: Temps max / jour
                secondary: |-
                  {% if has_value('number.fio_pd0_max_upt') %}{{ states('number.fio_pd0_max_upt') }} {{ state_attr('number.fio_pd0_max_upt', 'unit_of_measurement') or '' }}{% else %}Indisponible{% endif %}
                multiline_secondary: true
                icon: mdi:timer-outline
                icon_color: grey
                tap_action: *more_info
                card_mod: *measure_tile
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Températures
            heading_style: title
          - type: custom:mini-graph-card
            name: Eau / Air · 24 h
            hours_to_show: 24
            points_per_hour: 2
            line_width: 2
            height: 140
            font_size: 90
            show:
              labels: true
              legend: false
              fill: fade
              extrema: false
            entities:
              - entity: sensor.fio_io_wat_tmp
                name: Eau
                color: '#0A84FF'
              - entity: sensor.fio_io_air_tmp
                name: Air
                color: '#FF9500'
            card_mod: *white_card
            grid_options:
              columns: 12
              rows: auto
          - type: history-graph
            title: Eau / consigne · 24 h
            hours_to_show: 24
            entities:
              - entity: sensor.fio_io_wat_tmp
                name: Eau
              - entity: number.fio_pl_wat_temp_sp
                name: Consigne
            card_mod: *white_card
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Informations complémentaires
            heading_style: title
          - type: entities
            show_header_toggle: false
            state_color: true
            entities:
              - entity: number.fio_pl_reg_dly_pid
                name: Délai avant régulation
                icon: mdi:timer-outline
                type: simple-entity
                tap_action: *more_info
              - entity: sensor.fio_pl_has_rsn
                name: Raison du chauffage
                icon: mdi:chip
            card_mod: *settings_list
            grid_options:
              columns: 12
              rows: auto
  - title: pH
    path: ph
    icon: mdi:flask-outline
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Mesure & consigne
            heading_style: title
          - type: custom:modern-circular-gauge
            entity: sensor.fio_io_ph
            name: pH
            unit: ''
            decimals: 1
            gauge_type: standard
            min: '{{ (states(''number.fio_pl_ph_setpoint'') | float + -1.5) if is_number(states(''number.fio_pl_ph_setpoint''))
              else 0 }}'
            max: '{{ (states(''number.fio_pl_ph_setpoint'') | float + 1.5) if is_number(states(''number.fio_pl_ph_setpoint''))
              else 3.0 }}'
            needle: true
            show_icon: false
            show_header: false
            state_font_size: 32
            gauge_background_style:
              width: 6
              opacity: 0.45
            gauge_foreground_style:
              width: 6
            segments:
              - from: '{{ (states(''number.fio_pl_ph_setpoint'') | float + -1.5) if is_number(states(''number.fio_pl_ph_setpoint''))
                  else 0.0 }}'
                color: '{{ ''#FF453A'' if is_number(states(''number.fio_pl_ph_setpoint'')) else ''#C7C7CC'' }}'
