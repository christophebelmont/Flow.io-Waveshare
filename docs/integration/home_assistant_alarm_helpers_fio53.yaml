# Home Assistant helper entities for Flow.io alarms.
#
# This file is meant to be included from Home Assistant configuration.yaml:
#
# template: !include docs/integration/home_assistant_alarm_helpers_fio53.yaml
#
# Legacy compatibility helpers. New firmware auto-discovers one binary_sensor
# and one reset button per registered AlarmId; no YAML helpers are required.
# Example: binary_sensor.fio53_alm_1000_active / button.fio53_alm_1000_reset.
# The prefix follows the HA configuration; entity IDs may be customized in HA.
# The global alm_reset_all and diagnostic alm_pack identities are preserved.
# Old alm_reset_slot_0..7 discovery records are removed automatically.
# After migrating existing cards/automations to the native entities, remove this
# include manually to avoid displaying both the helpers and the native sensors.
#
# This helper file decodes `sensor.fio53_alm_pack`, which is built in
# `AlarmModule::buildPacked_()` with 5 bits per slot:
# - bit 0: active
# - bit 1: resettable
# - bit 2: condition == true
# - bits 3..4: severity
#
# Slot mapping for the current FlowIO profile, based on module init order:
# - slot 0 -> AlarmId 1000 -> psi_low
# - slot 1 -> AlarmId 1001 -> psi_high
# - slot 2 -> AlarmId 1002 -> ph_tank_low
# - slot 3 -> AlarmId 1003 -> chlorine_tank_low
# - slot 4 -> AlarmId 1004 -> ph_pump_max_uptime
# - slot 5 -> AlarmId 1005 -> chlorine_pump_max_uptime
# - slot 6 -> AlarmId 1006 -> pool_water_level_low
#
# Pressure and pump maximum-uptime alarms are latched. Native reset buttons
# are named by AlarmId (1000, 1001, 1004, 1005), independently of slot order.
#
# If alarm registration order changes in firmware, this mapping must be updated.

- binary_sensor:
      - name: fio53_alarm_any_active
        unique_id: fio53_alarm_any_active
        icon: mdi:alarm-multiple
        availability: >
          {{ states('sensor.fio53_alm_pack') not in ['unknown', 'unavailable', 'none'] }}
        state: >
          {% set pack = states('sensor.fio53_alm_pack') | int(0) %}
          {% set ns = namespace(active=false) %}
          {% for slot in range(0, 8) %}
            {% if ((pack // (32 ** slot)) % 2) == 1 %}
              {% set ns.active = true %}
            {% endif %}
          {% endfor %}
          {{ ns.active }}

      - name: fio53_psi_low_active
        unique_id: fio53_psi_low_active
        icon: mdi:alarm-light
        availability: >
          {{ states('sensor.fio53_alm_pack') not in ['unknown', 'unavailable', 'none'] }}
        state: >
          {% set pack = states('sensor.fio53_alm_pack') | int(0) %}
          {{ ((pack // 1) % 2) == 1 }}

      - name: fio53_psi_low_resettable
        unique_id: fio53_psi_low_resettable
        icon: mdi:restart-alert
        availability: >
          {{ states('sensor.fio53_alm_pack') not in ['unknown', 'unavailable', 'none'] }}
        state: >
          {% set pack = states('sensor.fio53_alm_pack') | int(0) %}
          {{ ((pack // 2) % 2) == 1 }}

