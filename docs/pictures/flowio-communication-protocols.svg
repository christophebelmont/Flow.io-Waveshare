<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 780" role="img" aria-labelledby="title description">
  <title id="title">Interfaces et protocoles de communication de flow.io</title>
  <desc id="description">Le logo flow.io est au centre. Autour sont reliés Ethernet et IP, Wi-Fi et IP, HTTP et WebSocket, MQTT et Home Assistant, NTP et mDNS, UDP pour l'afficheur distant, RS485 et Modbus RTU, UART pour Nextion, I2C, 1-Wire, SPI et radio 433 MHz.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#e9f7ff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#073263" flood-opacity="0.13"/>
    </filter>
    <style>
      .connector { fill: none; stroke: #75bfe9; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #9ed8f4; stroke-width: 1.5; filter: url(#shadow); }
      .node-title { fill: #073263; font-family: Inter, Arial, sans-serif; font-size: 21px; font-weight: 700; text-anchor: middle; }
      .node-detail { fill: #426584; font-family: Inter, Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .core-caption { fill: #426584; font-family: Inter, Arial, sans-serif; font-size: 15px; text-anchor: middle; letter-spacing: 0.5px; }
    </style>
  </defs>

  <rect width="1200" height="780" rx="28" fill="url(#background)"/>

  <g aria-hidden="true">
    <path class="connector" d="M500 315 C420 245 310 165 220 120"/>
    <path class="connector" d="M540 295 C500 220 485 155 480 120"/>
    <path class="connector" d="M660 295 C700 220 715 155 720 120"/>
    <path class="connector" d="M700 315 C780 245 890 165 980 120"/>
    <path class="connector" d="M490 355 C385 340 280 335 220 335"/>
    <path class="connector" d="M710 355 C815 340 920 335 980 335"/>
    <path class="connector" d="M490 415 C385 435 280 445 220 445"/>
    <path class="connector" d="M710 415 C815 435 920 445 980 445"/>
    <path class="connector" d="M500 455 C420 530 310 610 220 665"/>
    <path class="connector" d="M540 475 C500 550 485 620 480 665"/>
    <path class="connector" d="M660 475 C700 550 715 620 720 665"/>
    <path class="connector" d="M700 455 C780 530 890 610 980 665"/>
  </g>

  <g transform="translate(30 72)">
    <rect class="node" width="220" height="96" rx="18"/>
    <text class="node-title" x="110" y="40">Ethernet · IP</text>
    <text class="node-detail" x="110" y="67">W5500 · réseau filaire</text>
  </g>
  <g transform="translate(290 72)">
    <rect class="node" width="220" height="96" rx="18"/>
    <text class="node-title" x="110" y="40">Wi-Fi · IP</text>
    <text class="node-detail" x="110" y="67">provisioning et accès local</text>
  </g>
  <g transform="translate(690 72)">
    <rect class="node" width="220" height="96" rx="18"/>
    <text class="node-title" x="110" y="40">HTTP · WebSocket</text>
    <text class="node-detail" x="110" y="67">interface web et mises à jour</text>
  </g>
  <g transform="translate(950 72)">
    <rect class="node" width="220" height="96" rx="18"/>
    <text class="node-title" x="110" y="40">MQTT</text>
    <text class="node-detail" x="110" y="67">Home Assistant Discovery</text>
  </g>

  <g transform="translate(30 287)">
    <rect class="node" width="220" height="96" rx="18"/>
    <text class="node-title" x="110" y="40">NTP · mDNS</text>
    <text class="node-detail" x="110" y="67">heure et découverte réseau</text>
  </g>
  <g transform="translate(950 287)">
    <rect class="node" width="220" height="96" rx="18"/>
    <text class="node-title" x="110" y="40">RS485 · Modbus RTU</text>
    <text class="node-detail" x="110" y="67">équipements de piscine</text>
  </g>
  <g transform="translate(30 397)">
    <rect class="node" width="220" height="96" rx="18"/>
    <text class="node-title" x="110" y="40">UDP</text>
    <text class="node-detail" x="110" y="67">afficheur HMI distant</text>
  </g>
  <g transform="translate(950 397)">
    <rect class="node" width="220" height="96" rx="18"/>
    <text class="node-title" x="110" y="40">UART · Nextion</text>
    <text class="node-detail" x="110" y="67">écran tactile local</text>
  </g>

  <g transform="translate(30 617)">
    <rect class="node" width="220" height="96" rx="18"/>
    <text class="node-title" x="110" y="40">I²C</text>
    <text class="node-detail" x="110" y="67">capteurs et extensions</text>
  </g>
  <g transform="translate(290 617)">
    <rect class="node" width="220" height="96" rx="18"/>
    <text class="node-title" x="110" y="40">1-Wire</text>
    <text class="node-detail" x="110" y="67">sondes de température</text>
  </g>
  <g transform="translate(690 617)">
    <rect class="node" width="220" height="96" rx="18"/>
    <text class="node-title" x="110" y="40">SPI</text>
    <text class="node-detail" x="110" y="67">Ethernet et écran local</text>
  </g>
  <g transform="translate(950 617)">
    <rect class="node" width="220" height="96" rx="18"/>
    <text class="node-title" x="110" y="40">Radio 433 MHz</text>
    <text class="node-detail" x="110" y="67">émission vers périphériques</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="390" y="285" width="420" height="200" rx="34" fill="url(#core)" stroke="#42bdf2" stroke-width="2"/>
    <image href="Logo_flowio.png" xlink:href="Logo_flowio.png" x="430" y="320" width="340" height="100" preserveAspectRatio="xMidYMid meet"/>
    <text class="core-caption" x="600" y="452">PLATEFORME OUVERTE ET MODULAIRE</text>
  </g>
</svg>
